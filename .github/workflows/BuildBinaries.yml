name: Build Binaries

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'

permissions:
  contents: write

jobs:
  update-release-notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/custom-7.0.1843.0' && contains(github.event.head_commit.message, '[release-notes-only]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Update permanent release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release edit v7.0.1843.0-bf1 \
          --repo "$GITHUB_REPOSITORY" \
          --notes-file Installer/ReleaseNotes-7.0.1843.0.md

  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-notes-only]') }}
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - uses: microsoft/setup-msbuild@v3
    - name: Clear local NuGet cache (workaround for failed restores on windows-latest)
      run: dotnet nuget locals all --clear
    - name: Build
      run: MSBuild -binaryLogger:Output\BuildAllTargets.binlog -m BuildAllTargets.proj
    - name: Create signed installer
      timeout-minutes: 10
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        [xml]$Manifest = Get-Content -LiteralPath 'NanaZipPackage\Package.appxmanifest'
        $Version = $Manifest.Package.Identity.Version
        if ($Version -ne '7.0.1843.0' -or $Manifest.Package.Identity.Name -ne 'BrunoFaria.NanaZip' -or $Manifest.Package.Identity.Publisher -ne 'CN=Bruno Faria') {
          throw 'The generated manifest does not match the stable custom package identity and version.'
        }
        if ($Manifest.Package.Properties.DisplayName -ne 'NanaZip') {
          throw 'The generated manifest is not using stable NanaZip branding.'
        }
        $Bundles = @(Get-ChildItem -LiteralPath 'Output\Binaries\AppPackages' -Recurse -Filter '*.msixbundle' |
          Where-Object { $_.Name -notmatch '_Debug' } |
          Where-Object { $_.Name -match '7\.0\.1843\.0' })
        if ($Bundles.Count -ne 1) {
          throw "Expected exactly one NanaZip 7.0.1843.0 release bundle, found $($Bundles.Count)."
        }
        $Bundle = $Bundles[0]
        Write-Host "Selected release bundle: $($Bundle.FullName)"

        $InstallerPath = Join-Path $PWD 'Output\NanaZipInstaller'
        New-Item -ItemType Directory -Path $InstallerPath -Force | Out-Null

        $Certificate = New-SelfSignedCertificate `
          -Type Custom `
          -KeyUsage DigitalSignature `
          -CertStoreLocation 'Cert:\CurrentUser\My' `
          -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
          -Subject 'CN=Bruno Faria' `
          -FriendlyName 'NanaZip Package Signing - Bruno Faria' `
          -KeyExportPolicy Exportable `
          -HashAlgorithm SHA256 `
          -NotAfter (Get-Date).AddYears(5)

        $PasswordText = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
        $Password = ConvertTo-SecureString -String $PasswordText -Force -AsPlainText
        $PfxPath = Join-Path $env:RUNNER_TEMP 'NanaZip.pfx'
        $CerPath = Join-Path $InstallerPath 'NanaZip.cer'
        Export-PfxCertificate -Cert $Certificate -FilePath $PfxPath -Password $Password | Out-Null
        Export-Certificate -Cert $Certificate -FilePath $CerPath | Out-Null
        Import-Certificate `
          -FilePath $CerPath `
          -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null

        $SignedBundle = Join-Path $InstallerPath "NanaZip_$Version.msixbundle"
        Copy-Item -LiteralPath $Bundle.FullName -Destination $SignedBundle

        $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter 'signtool.exe' |
          Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
          Sort-Object FullName -Descending |
          Select-Object -First 1
        if (-not $SignTool) {
          throw 'SignTool was not found in the Windows SDK.'
        }

        $SignToolPath = $SignTool.FullName
        & $SignToolPath sign /fd SHA256 /f $PfxPath /p $PasswordText $SignedBundle
        if ($LASTEXITCODE -ne 0) {
          throw "SignTool failed with exit code $LASTEXITCODE."
        }
        if ((Get-Item -LiteralPath $SignedBundle).Length -eq 0) {
          throw 'SignTool produced an empty MSIX bundle.'
        }

        Copy-Item -LiteralPath 'Installer\Install-NanaZip.ps1' -Destination $InstallerPath
        Copy-Item -LiteralPath 'Installer\Install.cmd' -Destination $InstallerPath
        Copy-Item -LiteralPath 'Installer\Uninstall-NanaZip.ps1' -Destination $InstallerPath
        Copy-Item -LiteralPath 'Installer\Uninstall.cmd' -Destination $InstallerPath
        Copy-Item -LiteralPath 'Installer\README.txt' -Destination $InstallerPath

        Remove-Item -LiteralPath $PfxPath -Force
        Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($Certificate.Thumbprint)" -Force
        Remove-Item -LiteralPath "Cert:\CurrentUser\TrustedPeople\$($Certificate.Thumbprint)" -Force
    - name: Upload signed installer
      uses: actions/upload-artifact@v7
      with:
        name: NanaZip_Signed_Installer
        path: Output/NanaZipInstaller
    - name: Publish permanent release
      if: github.event_name == 'push' && github.ref == 'refs/heads/custom-7.0.1843.0'
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ReleaseTag = 'v7.0.1843.0-bf1'
        $ReleaseNotesPath = Join-Path $PWD 'Installer\ReleaseNotes-7.0.1843.0.md'

        $ErrorActionPreference = 'Continue'
        & gh release view $ReleaseTag --repo $env:GITHUB_REPOSITORY *> $null
        $ReleaseExists = $LASTEXITCODE -eq 0
        $ErrorActionPreference = 'Stop'

        if ($ReleaseExists) {
          & gh release edit $ReleaseTag `
            --repo $env:GITHUB_REPOSITORY `
            --notes-file $ReleaseNotesPath
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release update failed with exit code $LASTEXITCODE."
          }
          Write-Host "Release $ReleaseTag already exists and its notes were updated."
          exit 0
        }

        $ReleaseArchive = Join-Path $PWD 'Output\NanaZip_7.0.1843.0_Installer.zip'
        Compress-Archive `
          -Path 'Output\NanaZipInstaller\*' `
          -DestinationPath $ReleaseArchive `
          -CompressionLevel Optimal

        $ChecksumPath = Join-Path $PWD 'Output\SHA256SUMS.txt'
        $ArchiveHash = (Get-FileHash -LiteralPath $ReleaseArchive -Algorithm SHA256).Hash.ToLowerInvariant()
        "$ArchiveHash  $([System.IO.Path]::GetFileName($ReleaseArchive))" |
          Set-Content -LiteralPath $ChecksumPath -Encoding Ascii

        & gh release create $ReleaseTag `
          $ReleaseArchive `
          $ChecksumPath `
          --repo $env:GITHUB_REPOSITORY `
          --target $env:GITHUB_SHA `
          --title 'NanaZip 7.0, version 2609.2 (7.0.1843.0)' `
          --notes-file $ReleaseNotesPath
        if ($LASTEXITCODE -ne 0) {
          throw "GitHub release creation failed with exit code $LASTEXITCODE."
        }
    - name: Upload build log after failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: NanaZip_BuildBinaryLog
        path: Output/BuildAllTargets.binlog
        if-no-files-found: ignore
